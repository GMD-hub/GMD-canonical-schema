name: One-time review-production cutover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-production-cutover
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and migrate review-production
    runs-on: ubuntu-latest
    environment: review-production-cutover
    env:
      APPROVED_TOOLING_COMMIT: f064987357fec71c67df909380ad039450f42eb4
      EXPECTED_REVIEW_HEAD: 983d7d9503fbf5c2c911ac9d85a37b88accfe4ac
      EXPECTED_PRODUCTION_HEAD: 8b5de18ae78f1dd5bb09511fd076c57e670f1db9
      EXPECTED_SOURCE: 6d6c10ee96cf3500b802b3e4aae05c70eb24ea9f
      EXPECTED_COUNT: "267"
      EXPECTED_PATH_DIGEST: 8fbe8f677f7431be19d34762ee665f33169f07610e5d3abe1b8b7fbbe9da2b1c
      REVIEW_APP_GH_OWNER: GMD-hub
      REVIEW_APP_GH_REPO: GMD-canonical-schema
      REVIEW_APP_GH_DEFAULT_BRANCH: main
    steps:
      - name: Check out the approved main workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.APPROVED_TOOLING_COMMIT }}
          fetch-depth: 0

      - name: Verify fixed refs and classify the cutover
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$APPROVED_TOOLING_COMMIT"

          main_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          review_head="$(git ls-remote origin refs/heads/review | cut -f1)"
          production_head="$(git ls-remote origin refs/heads/review-production | cut -f1)"

          test "$main_head" = "$GITHUB_SHA"
          test "$review_head" = "$EXPECTED_REVIEW_HEAD"

          if test "$production_head" = "$EXPECTED_PRODUCTION_HEAD"; then
            echo "mode=migrate" >> "$GITHUB_OUTPUT"
            echo "existing_commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin \
            refs/heads/review-production:refs/remotes/origin/review-production
          read -r commit parent extra <<< "$(git rev-list --parents -n 1 "$production_head")"
          test "$commit" = "$production_head"
          test "$parent" = "$EXPECTED_PRODUCTION_HEAD"
          test -z "${extra:-}"

          expected_changes="$(printf '%s\n' \
            $'A\textraction/30_review/queue-descriptor.yml' \
            $'D\textraction/30_review/queue-index.yml' \
            $'D\textraction/30_review/queue-manifest.yml')"
          actual_changes="$(git diff --name-status \
            "$EXPECTED_PRODUCTION_HEAD" "$production_head")"
          test "$actual_changes" = "$expected_changes"

          app_actor="$(gh api \
            "repos/$REVIEW_APP_GH_OWNER/$REVIEW_APP_GH_REPO/commits/$production_head" \
            --jq '([.author.login, .committer.login] | any(. == "gmd-review-app[bot]"))')"
          test "$app_actor" = "true"
          echo "mode=resume" >> "$GITHUB_OUTPUT"
          echo "existing_commit=$production_head" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore the review-app environment
        uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          working-directory: review-app

      - name: Validate the untouched production queue
        shell: bash
        working-directory: review-app
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/review-production-before"
          git worktree add --detach "$baseline" "$EXPECTED_PRODUCTION_HEAD"
          Rscript tools/validate-production-queue.R \
            --repo "$baseline" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-count "$EXPECTED_COUNT" \
            --expected-path-digest "$EXPECTED_PATH_DIGEST" \
            --expect-bootstrap-state
          test -z "$(git -C "$baseline" status --porcelain)"
          git worktree remove "$baseline"

      - name: Migrate review-production once
        if: steps.preflight.outputs.mode == 'migrate'
        id: migration
        env:
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        shell: bash
        working-directory: review-app
        run: |
          set -euo pipefail
          test -n "$GITHUB_APP_ID"
          test -n "$GITHUB_APP_INSTALLATION_ID"
          test -n "$GITHUB_APP_PRIVATE_KEY"
          evidence="$RUNNER_TEMP/review-production-migration.json"
          Rscript tools/migrate-review-queue.R \
            --target-branch review-production \
            --expected-head "$EXPECTED_PRODUCTION_HEAD" \
            --actor "$GITHUB_ACTOR" \
            --authorize-production > "$evidence"

          EVIDENCE_PATH="$evidence" Rscript -e '
            evidence_path <- Sys.getenv("EVIDENCE_PATH")
            evidence <- jsonlite::fromJSON(evidence_path, simplifyVector = TRUE)
            expected <- list(
              repository = "GMD-hub/GMD-canonical-schema",
              target_branch = "review-production",
              expected_old_head = Sys.getenv("EXPECTED_PRODUCTION_HEAD"),
              source_revision = Sys.getenv("EXPECTED_SOURCE"),
              source_format = "production_v2",
              record_count = 267L,
              approvals_enabled = FALSE
            )
            for (field in names(expected)) {
              if (!identical(evidence[[field]], expected[[field]])) {
                stop(sprintf("migration evidence field %s is invalid", field))
              }
            }
            sha1_fields <- c("migration_commit")
            sha256_fields <- c("record_set_sha256", "preserved_record_blob_sha256")
            if (any(!grepl("^[0-9a-f]{40}$", unlist(evidence[sha1_fields])))) {
              stop("migration evidence contains an invalid Git commit")
            }
            if (any(!grepl("^[0-9a-f]{64}$", unlist(evidence[sha256_fields])))) {
              stop("migration evidence contains an invalid SHA-256")
            }
            raw <- paste(readLines(evidence_path, warn = FALSE), collapse = "\n")
            secret_names <- c(
              "GITHUB_APP_ID", "GITHUB_APP_INSTALLATION_ID",
              "GITHUB_APP_PRIVATE_KEY"
            )
            secrets <- Sys.getenv(secret_names, unset = "")
            if (any(nzchar(secrets) & vapply(
              secrets, function(secret) grepl(secret, raw, fixed = TRUE), logical(1)
            ))) {
              stop("migration evidence contains secret material")
            }
            cat(jsonlite::toJSON(
              evidence, auto_unbox = TRUE, pretty = TRUE, null = "null"
            ), "\n")
          '

          migration_commit="$(EVIDENCE_PATH="$evidence" Rscript -e '
            evidence <- jsonlite::fromJSON(Sys.getenv("EVIDENCE_PATH"))
            cat(evidence$migration_commit)
          ')"
          echo "migration_commit=$migration_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve the migration commit
        id: result
        env:
          MODE: ${{ steps.preflight.outputs.mode }}
          NEW_COMMIT: ${{ steps.migration.outputs.migration_commit }}
          EXISTING_COMMIT: ${{ steps.preflight.outputs.existing_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$MODE" = "migrate"; then
            migration_commit="$NEW_COMMIT"
          else
            test "$MODE" = "resume"
            migration_commit="$EXISTING_COMMIT"
          fi
          [[ "$migration_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "migration_commit=$migration_commit" >> "$GITHUB_OUTPUT"

      - name: Prove the migration changed only queue controls
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_COMMIT: ${{ steps.result.outputs.migration_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/review-production:refs/remotes/origin/review-production
          test "$(git rev-parse origin/review-production)" = "$MIGRATION_COMMIT"

          read -r commit parent extra <<< "$(git rev-list --parents -n 1 "$MIGRATION_COMMIT")"
          test "$commit" = "$MIGRATION_COMMIT"
          test "$parent" = "$EXPECTED_PRODUCTION_HEAD"
          test -z "${extra:-}"

          app_actor="$(gh api \
            "repos/$REVIEW_APP_GH_OWNER/$REVIEW_APP_GH_REPO/commits/$MIGRATION_COMMIT" \
            --jq '([.author.login, .committer.login] | any(. == "gmd-review-app[bot]"))')"
          test "$app_actor" = "true"

          expected_changes="$(printf '%s\n' \
            $'A\textraction/30_review/queue-descriptor.yml' \
            $'D\textraction/30_review/queue-index.yml' \
            $'D\textraction/30_review/queue-manifest.yml')"
          actual_changes="$(git diff --name-status \
            "$EXPECTED_PRODUCTION_HEAD" "$MIGRATION_COMMIT")"
          test "$actual_changes" = "$expected_changes"

          before="$RUNNER_TEMP/review-record-blobs-before"
          after="$RUNNER_TEMP/review-record-blobs-after"
          git ls-tree -r --format='%(objectname) %(path)' \
            "$EXPECTED_PRODUCTION_HEAD" -- extraction/30_review \
            | while read -r sha path; do
                if [[ "$path" =~ /VAR-[a-z0-9]+\.review\.yml$ ]]; then
                  printf '%s %s\n' "$sha" "$path"
                fi
              done | sort > "$before"
          git ls-tree -r --format='%(objectname) %(path)' \
            "$MIGRATION_COMMIT" -- extraction/30_review \
            | while read -r sha path; do
                if [[ "$path" =~ /VAR-[a-z0-9]+\.review\.yml$ ]]; then
                  printf '%s %s\n' "$sha" "$path"
                fi
              done | sort > "$after"
          test "$(wc -l < "$before" | tr -d ' ')" = "$EXPECTED_COUNT"
          cmp --silent "$before" "$after"

      - name: Validate the migrated production queue
        env:
          MIGRATION_COMMIT: ${{ steps.result.outputs.migration_commit }}
        shell: bash
        working-directory: review-app
        run: |
          set -euo pipefail
          migrated="$RUNNER_TEMP/review-production-after"
          git worktree add --detach "$migrated" "$MIGRATION_COMMIT"
          Rscript tools/validate-production-queue.R \
            --repo "$migrated" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-count "$EXPECTED_COUNT" \
            --expected-path-digest "$EXPECTED_PATH_DIGEST" \
            --expect-bootstrap-state
          MIGRATED_PATH="$migrated" Rscript -e '
            descriptor <- yaml::read_yaml(file.path(
              Sys.getenv("MIGRATED_PATH"),
              "extraction/30_review/queue-descriptor.yml"
            ))
            if (!identical(as.character(descriptor$schema_version), "1.1")) {
              stop("migrated descriptor is not schema 1.1")
            }
            if (!identical(descriptor$approvals_enabled, FALSE)) {
              stop("migrated descriptor enables approval")
            }
          '
          test -z "$(git -C "$migrated" status --porcelain)"
          git worktree remove "$migrated"

      - name: Confirm final protected refs
        env:
          MIGRATION_COMMIT: ${{ steps.result.outputs.migration_commit }}
        shell: bash
        run: |
          set -euo pipefail
          review_head="$(git ls-remote origin refs/heads/review | cut -f1)"
          production_head="$(git ls-remote origin refs/heads/review-production | cut -f1)"
          test "$review_head" = "$EXPECTED_REVIEW_HEAD"
          test "$production_head" = "$MIGRATION_COMMIT"
          {
            echo "## Review production cutover"
            echo
            echo "Validated and migrated 267 records."
            echo
            echo "Migration commit: \`$MIGRATION_COMMIT\`"
            echo
            echo "Approval remains disabled. Connect was not changed."
          } >> "$GITHUB_STEP_SUMMARY"
