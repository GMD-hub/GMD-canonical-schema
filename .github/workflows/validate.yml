name: Validate canonical schema

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python_validation:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Validate schema and capture governance reports
        run: |
          mkdir -p governance-reports
          python3 validation/validate_country_layer.py | tee governance-reports/country-layer-validation.md

      - name: Compile PER smoke-test bundles
        run: |
          python3 build/compile_bundle.py PER 2019
          python3 build/compile_bundle.py PER 1995

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: governance-reports/
          if-no-files-found: warn

  review_app_r_validation:
    name: Review-app R validation
    runs-on: ubuntu-latest
    env:
      REVIEW_APP_OFFLINE: "1"
      REVIEW_APP_ROLES: ${{ github.workspace }}/review-app/config/roles.yml
      NOT_CRAN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run browser recovery tests
        working-directory: review-app
        run: node --test tests/js/review-ui.test.js

      - name: Install and verify libgit2 runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgit2-dev
          pkg-config --exists libgit2
          printf '#include <git2.h>\nint main(void) { git_libgit2_init(); git_libgit2_shutdown(); return 0; }\n' > /tmp/check-libgit2.c
          cc /tmp/check-libgit2.c $(pkg-config --cflags --libs libgit2) -o /tmp/check-libgit2
          /tmp/check-libgit2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: review-app

      - name: Install R test tooling
        working-directory: review-app
        run: |
          Rscript -e 'renv::install(c("devtools", "golem", "rprojroot", "shinytest2", "testthat"), prompt = FALSE)'

      - name: Run focused review-app tests
        working-directory: review-app
        run: |
          Rscript -e '
            pkgload::load_all(".")
            focused <- c(
              "tests/testthat/test-index.R",
              "tests/testthat/test-github-adapter.R",
              "tests/testthat/test-actions.R",
              "tests/testthat/test-detail.R",
              "tests/testthat/test-draft-recovery.R",
              "tests/testthat/test-draft-recovery-integration.R",
              "tests/testthat/test-frontmatter.R",
              "tests/testthat/test-recovery.R",
              "tests/testthat/test-app-smoke.R",
              "tests/testthat/test-queue-manifest.R",
              "tests/testthat/test-source-binding.R",
              "tests/testthat/test-enrollment.R"
            )
            focused <- focused[file.exists(focused)]
            if (!length(focused)) stop("no focused review-app tests found")
            for (path in focused) testthat::test_file(path)
          '

      - name: Run full review-app tests
        working-directory: review-app
        run: Rscript -e 'devtools::test(reporter = "summary")'

      - name: Run R CMD check
        working-directory: review-app
        run: |
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual reviewapp_0.1.0.tar.gz
