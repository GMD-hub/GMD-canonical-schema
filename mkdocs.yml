site_name: GMD Canonical Variable Schema
site_description: Educational documentation for the GMD Canonical Variable Schema
site_url: https://gmd-hub.github.io/GMD-canonical-schema/
repo_url: https://github.com/GMD-hub/GMD-canonical-schema
repo_name: GMD-hub/GMD-canonical-schema
edit_uri: edit/main/wiki/

docs_dir: wiki
site_dir: site
strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/transit-connection-variant
    repo: fontawesome/brands/github
  font:
    text: Atkinson Hyperlegible
    code: IBM Plex Mono
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Overview: index.md
  - Learning paths: Learning-Paths.md
  - How the system works:
      - Architecture and data flow: Architecture.md
      - Repository map: Repository-Map.md
  - Canonical knowledge:
      - Artifact model: Artifact-Model.md
      - Country parameter layer: Country-Parameter-Layer.md
  - From draft to runtime:
      - Artifact lifecycle: Artifact-Lifecycle.md
      - Validation and runtime bundles: Validation-and-Builds.md
      - Governance and contributing: Governance-and-Contributing.md
  - Glossary: Glossary.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
      title: On this page

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/progress.js

copyright: GMD Canonical Variable Schema · Documentation reflects the repository's current draft status

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn