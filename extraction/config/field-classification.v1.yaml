# Field Classification Matrix v1
# Generated: 2026-08-03
# Authority: governance/decisions/Extraction-Preflight-2026-08.md Decision 12 (classification matrix)
# Encodes the approved Phase 1 governance baseline.
# Phase 3 Step 6 validates against this; changes require a governance decision.
#
# Valid classes:
#   source-explicit        — Copy from cited evidence without reinterpretation
#   deterministically-derived — Compute by versioned Python rule; retain input citations
#   governed-constant       — Read from approved configuration; never infer from prose
#   agent-interpreted       — Require direct citations, confidence, and critic review
#   generated-metadata      — Produce in orchestration layer; keep volatile metadata separate
#   unresolved              — Store null in candidate; block canonical emission

classifications:
  - model: "VariableDefinition"
    fields:
      - field: "variable_id"
        class: "deterministically-derived"
      - field: "canonical_label"
        class: "source-explicit"
      - field: "variable_name"
        class: "source-explicit"
