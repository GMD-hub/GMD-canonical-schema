/* =====================================================================
   GMD canonical variables — the derivation, mirrored from the Python.

   The concordance maps *atomic* things: a national programme onto an
   ISCED level, a national category onto a JMP node. What GMD publishes
   is a small fixed code list, and that list is a deterministic function
   of the atomic mapping. These functions are the same rules the
   extractor writes into {ISO}_edu_derivation.json, computed here so the
   screen works against a folder extracted before those files existed.

   Definitions from GMD 2.0 List of Variables (25 Nov 2019), "GMD 1.5".
   ===================================================================== */

const NC_EDUCAT7 = {1:'No education', 2:'Primary incomplete', 3:'Primary complete',
  4:'Secondary incomplete', 5:'Secondary complete',
  6:'Higher than secondary but not university', 7:'University incomplete or complete'};
const NC_EDUCAT5 = {1:'No education', 2:'Primary incomplete',
  3:'Primary complete but secondary incomplete', 4:'Secondary complete',
  5:'Some tertiary/post-secondary'};
const NC_EDUCAT4 = {1:'No education', 2:'Primary (complete or incomplete)',
  3:'Secondary (complete or incomplete)', 4:'Tertiary (complete or incomplete)'};
const NC_7TO5 = {1:1,2:2,3:3,4:3,5:4,6:5,7:5};
const NC_7TO4 = {1:1,2:2,3:2,4:3,5:3,6:4,7:4};
const NC_BAND = {'0':'pre_primary','1':'primary','2':'secondary','3':'secondary',
  '4':'post_secondary','5':'post_secondary','6':'university','7':'university',
  '8':'university','9':'other'};

function ncEducat7Of(isced, complete){
  const band = NC_BAND[String(isced||'').trim()[0]] || 'other';
  if(band==='pre_primary') return 1;
  if(band==='primary')   return complete==null ? null : (complete?3:2);
  if(band==='secondary'){
    if(complete==null) return null;
    if(String(isced).trim()[0]==='2') return 4;   /* finishing ISCED 2 is still inside secondary */
    return complete?5:4;
  }
  if(band==='post_secondary') return 6;
  if(band==='university') return 7;
  return null;
}
function ncLevelYears(s){
  let v = s.years_at_completion;
  if(v && typeof v==='object') v = v.value;
  const n = parseFloat(v); return isNaN(n) ? null : n;
}
/* the ladder carries the LEVEL's total on every rung of it; years at grade g
   are that total minus the grades still to run in the level */
function ncCumYears(ladder){
  const steps = (ladder||[]).filter(s=>s.grade!=null).slice().sort((a,b)=>a.grade-b.grade);
  const out = {};
  let i = 0;
  while(i < steps.length){
    const key = String(steps[i].isced||'')[0] + '|' + (steps[i].programme||'');
    let j = i;
    while(j+1 < steps.length &&
          String(steps[j+1].isced||'')[0] + '|' + (steps[j+1].programme||'') === key) j++;
    const total = ncLevelYears(steps[j]);
    if(total != null){
      const last = steps[j].grade;
      for(let k=i;k<=j;k++) out[steps[k].grade] = Math.round((total-(last-steps[k].grade))*100)/100;
    }
    i = j + 1;
  }
  return out;
}
function ncEduCapability(ladder, rows){
  const seen = new Set();
  (ladder||[]).forEach(s=>{ if(s.isced) seen.add(String(s.isced)[0]); });
  (rows||[]).forEach(r=>{ if(r.isced) seen.add(String(r.isced)[0]); });
  const hasP=seen.has('1'), hasL=seen.has('2'), hasU=seen.has('3');
  const hasPost=seen.has('4')||seen.has('5');
  const hasT=seen.has('6')||seen.has('7')||seen.has('8');
  const hasComp=(ladder||[]).some(s=>s.completes_level);
  const hasYears=Object.keys(ncCumYears(ladder)).length>0;
  const o = {};
  o.educat4 = !hasP ? {ok:false, why:'the ladder has no ISCED 1 rung, so primary cannot be separated from anything else'}
            : (hasL||hasU||hasT||hasPost) ? {ok:true}
            : {ok:true, note:'only primary rungs are present; anyone above primary will be missing, not miscoded'};
  o.educat5 = !o.educat4.ok ? {ok:false, why:'educat4 could not be produced'}
            : !hasComp ? {ok:false, why:'no rung on the ladder is marked as completing its level, so complete cannot be separated from incomplete'}
            : !hasU ? {ok:false, why:"the workbook has no ISCED 3 programme, so 'secondary complete' has no rung to attach to"}
            : {ok:true};
  o.educat7 = !o.educat5.ok ? {ok:false, why:'educat5 could not be produced'}
            : !(hasL||hasU) ? {ok:false, why:"no lower or upper secondary programme, so 'primary complete' and 'secondary incomplete' cannot be told apart"}
            : (!hasPost && !hasT) ? {ok:true, note:'no post-secondary or tertiary programme in the workbook; categories 6 and 7 will never be produced for this country'}
            : {ok:true};
  o.educy = hasYears ? {ok:true}
          : {ok:false, why:'the workbook gives no theoretical duration, so cumulative years cannot be computed'};
  o.finest = o.educat7.ok?'educat7' : o.educat5.ok?'educat5' : o.educat4.ok?'educat4' : null;
  o.isced_levels = [...seen].sort();
  return o;
}
function ncEduCrosswalk(ladder, cap){
  const cum = ncCumYears(ladder);
  const out = []; let prev = 0;
  (ladder||[]).filter(s=>s.grade!=null).slice().sort((a,b)=>a.grade-b.grade).forEach(s=>{
    const isced = String(s.isced||'')[0] || '';
    const complete = !!s.completes_level;
    let raw = ncEducat7Of(isced, complete);
    if(raw==null) raw = ncEducat7Of(isced, false);
    let e7 = raw, carried = false;
    if(e7!=null && e7<prev){ e7 = prev; carried = true; }
    if(e7!=null) prev = e7;
    out.push({grade:s.grade, isced, isced_a:s.isced_a||'', programme:s.programme||'',
      completes_level:complete, attainment:s.attainment_if_left_here||s.attainment||'',
      alternatives:s.alternatives||[],
      educat7: cap.educat7.ok?e7:null, educat5: cap.educat5.ok?(NC_7TO5[e7]||null):null,
      educat4: cap.educat4.ok?(NC_7TO4[e7]||null):null,
      educy: cap.educy.ok?(cum[s.grade]!=null?cum[s.grade]:null):null,
      educat7_raw: raw, carried_forward: carried,
      educat7_label: NC_EDUCAT7[e7]||'',
      why: `grade ${s.grade} sits in ISCED ${isced} (${NC_BAND[isced]||'other'}); the level is `
         + `${complete?'finished':'not finished'} at this grade`
         + (carried?`; the raw lookup gave ${raw} but an earlier grade already reached ${e7}, `
                    +`so the higher value is carried forward`:'')});
  });
  return out;
}
function ncDeriveEdu(b){
  if(b.derivation && b.derivation.crosswalk) return b.derivation;
  const cap = ncEduCapability(b.ladder, b.rows);
  return {schema:'gmd.derivation.education', computed_here:true,
    frame:"GMD 2.0 List of Variables (25 Nov 2019), sheet 'GMD 1.5'",
    atomic:['isced_a','grade completed','atschool'],
    derived:['educat7','educat5','educat4','educy'],
    capability:cap, labels:{educat7:NC_EDUCAT7, educat5:NC_EDUCAT5, educat4:NC_EDUCAT4},
    crosswalk: ncEduCrosswalk(b.ladder, cap)};
}

/* ---------------- WASH ---------------- */
const NC_WATER_SOURCE = {1:'Piped water into dwelling',2:'Piped water to yard/plot',
  3:'Public tap or standpipe',4:'Tubewell or borehole',5:'Protected dug well',
  6:'Protected spring',7:'Bottled water',8:'Rainwater',9:'Unprotected spring',
  10:'Unprotected dug well',11:'Cart with small tank/drum',12:'Tanker-truck',
  13:'Surface water',14:'Other'};
const NC_SAN_SOURCE = {1:'A flush toilet',2:'A piped sewer system',3:'A septic tank',
  4:'Pit latrine',5:'Ventilated improved pit latrine (VIP)',6:'Pit latrine with slab',
  7:'Composting toilet',8:'Special case',9:'A flush/pour flush to elsewhere',
  10:'A pit latrine without slab',11:'Bucket',12:'Hanging toilet or hanging latrine',
  13:'No facilities or bush or field',14:'Other'};
const NC_PIPED_ACC = {0:'No',1:'Yes, in premise',2:'Yes, but not in premise',
  3:'Yes, unstated whether in or outside premise'};
const NC_TOILET_ACC = {0:'No',1:'Yes, in premise',
  2:'Yes, but not in premise including public toilet',
  3:'Yes, unstated whether in or outside premise'};
/* unimproved variants are tested first: "unprotected_spring" contains
   "protected_spring", and "without_slab" contains "with_slab" */
const NC_WATER_RULES = [
  [/piped_water_into_dwelling|piped_into_dwelling/,1],[/piped_water_to_yard|piped_to_yard|yard_plot/,2],
  [/public_tap|standpipe/,3],[/tubewell|borehole|tube_well/,4],
  [/unprotected_spring/,9],[/unprotected_dug_well|unprotected_well|unprotected_ground_water/,10],
  [/protected_dug_well|protected_well/,5],[/protected_spring/,6],
  [/bottled|packaged_water|sachet/,7],[/rainwater/,8],
  [/cart|small_tank|drum/,11],[/tanker/,12],
  [/surface_water|river|dam|lake|pond|stream|canal|irrigation/,13],
  [/piped_on_premises/,1],[/tap_water/,3],
];
const NC_SAN_RULES = [
  [/to_piped_sewer_system|piped_sewer/,2],[/to_septic_tank|septic/,3],
  [/ventilated_improved|(^|\.)vip(\.|$)/,5],
  [/without_slab|open_pit|no_slab/,10],[/with_slab|slab/,6],
  [/composting|twin_pit/,7],[/to_pit(_latrine)?/,4],
  [/to_elsewhere|to_open_drain|to_unknown/,9],
  [/bucket/,11],[/hanging/,12],[/open_defecation|no_facility|bush|field/,13],
  [/flush_and_pour_flush|flush/,1],[/pit_latrine/,4],[/other/,14],
];
const NC_WATER_SPAN = {ground_water:[4,5,6,9,10],'ground_water.all_wells':[4,5,10],
  'ground_water.protected_ground_water':[4,5,6],'ground_water.unprotected_ground_water':[9,10],
  'ground_water.protected_wells_or_springs':[5,6],'ground_water.unprotected_wells_or_springs':[9,10],
  'ground_water.wells_or_springs':[4,5,6,9,10],'ground_water.traditional_wells':[5,10],
  delivered_water:[11,12], other_improved_sources:[7,8]};
const NC_SAN_SPAN = {pit_latrine:[4,6,10],'flush_and_pour_flush.to_unknown_place':[1,9]};

const NC_QUALIFIER = /\.(private|public|other|shared|not_shared|unknown)$/;
function ncMapWash(jmpId, label, domain){
  const key = (jmpId||'').trim();
  const SPAN = domain==='water'?NC_WATER_SPAN:NC_SAN_SPAN;
  let span = SPAN[key];
  /* "protected wells or springs > private" is still wells *or* springs: a
     qualifier that says who owns it does not say which technology it is */
  if(!span && NC_QUALIFIER.test(key)){
    const parent = key.replace(NC_QUALIFIER,'');
    if(SPAN[parent]) span = SPAN[parent];
  }
  if(span) return {code:null, spans:span,
    why:`'${key}' is a branch of the JMP tree covering ${span.length} GMD codes; it needs a splitting rule`};
  const hay = `${key} ${label||''}`.toLowerCase().replace(/[/-]/g,'_').replace(/[^a-z0-9_. ]+/g,' ');
  const rules = domain==='water'?NC_WATER_RULES:NC_SAN_RULES;
  for(let i=0;i<rules.length;i++) if(rules[i][0].test(hay))
    return {code:rules[i][1], spans:[], why:`JMP node '${key}' maps to GMD code ${rules[i][1]}`};
  return {code:14, spans:[], why:'no JMP node matched a GMD code; falls to 14 (Other), which is the country’s call'};
}
function ncImprovedOf(c){ return c==null?null : (c>=1&&c<=8)?1 : (c>=9&&c<=13)?0 : null; }
function ncPipedAccOf(c){ if(c==null||c===14) return null; if(c===1) return 1;
  if(c===2||c===3) return 2; return 0; }
function ncToiletAccOf(c){ if(c==null||c===14) return null; if(c<=3) return 1;
  if(c===9) return 2; return 0; }

function ncDeriveWash(b){
  if(b.derivation && b.derivation.crosswalk) return b.derivation;
  const dom = b.domain;
  const labels = dom==='water'?NC_WATER_SOURCE:NC_SAN_SOURCE;
  const xw = (b.rows||[]).map(r=>{
    const m = ncMapWash(r.jmp_id, r.jmp || r.label, dom);
    const imp = ncImprovedOf(m.code);
    const dis = imp!=null && r.improved!=null && !!imp !== !!r.improved;
    let note = '';
    if(dis) note = (m.code===11||m.code===12)
      ? 'JMP counts delivered water as improved; the GMD 1.5 code list puts carts (11) and tanker '
        +'trucks (12) in the unimproved range 9-13. A difference between the two frames, not a mapping '
        +'error — the GMD range governs because imp_wat_rec is a GMD variable.'
      : m.code===7
      ? 'JMP treats packaged water as improved only where the household also has an improved source '
        +'for other uses; GMD code 7 is unconditionally in the improved range.'
      : 'the JMP node and the GMD code list disagree on improved status; the GMD range rule governs '
        +'and the difference is recorded rather than discovered later.';
    return {code:r.code, label:r.label, jmp:r.jmp, jmp_id:r.jmp_id,
      gmd_code:m.code, gmd_label: m.code?labels[m.code]:'', spans:m.spans,
      improved:imp, jmp_improved:r.improved, disagrees_with_jmp:dis, disagreement_note:note,
      access: dom==='water'?ncPipedAccOf(m.code):ncToiletAccOf(m.code),
      why:m.why, observed_in:r.observed_in||[], source_row:r.source_row};
  });
  const src = dom==='water'?'water_source':'sanitation_source';
  const imp = dom==='water'?'imp_wat_rec':'imp_san_rec';
  const acc = dom==='water'?'pipedwater_acc':'toilet_acc';
  const mapped = xw.filter(r=>r.gmd_code), spans = xw.filter(r=>r.spans.length);
  const residual = xw.filter(r=>r.gmd_code===14);
  const cap = {};
  cap[src] = !xw.length ? {ok:false, why:'no national category was read from the workbook'}
    : mapped.length < xw.length*0.5
      ? {ok:false, why:`only ${mapped.length} of ${xw.length} categories resolved to a GMD code; `
                      +`the tree this country reports on is too coarse to map`}
      : spans.length ? {ok:true, note:`${spans.length} categor${spans.length===1?'y':'ies'} span more `
                                     +`than one GMD code and need a splitting rule`}
                     : {ok:true};
  cap[imp] = !cap[src].ok ? {ok:false, why:`${src} could not be produced`}
    : residual.length ? {ok:true, note:`${residual.length} categor${residual.length===1?'y':'ies'} fell to `
        +`code 14, which the range rule cannot decide; a country ruling is required before ${imp} is complete`}
    : {ok:true};
  cap[acc] = cap[src].ok ? {ok:true} : {ok:false, why:`${src} could not be produced`};
  if(dom==='water') cap.watertype_quest = {ok:false, why:
    'the type of water question asked is a property of the survey instrument, not of the country '
    +'concordance; it is set by the survey-level mapping'};
  cap.finest = cap[src].ok ? src : null;
  return {schema:`gmd.derivation.wash.${dom}`, computed_here:true,
    frame:"GMD 2.0 List of Variables (25 Nov 2019), sheet 'GMD 1.5'",
    atomic:['the survey category, mapped to a JMP node'],
    derived: dom==='water'?['water_source','imp_wat_rec','pipedwater_acc','watertype_quest']
                          :['sanitation_source','imp_san_rec','toilet_acc'],
    capability:cap, labels:{[src]:labels,
      [acc]: dom==='water'?NC_PIPED_ACC:NC_TOILET_ACC},
    improved_rule:{yes:[1,8], no:[9,13], country_call:14},
    crosswalk:xw, disagreements: xw.filter(r=>r.disagrees_with_jmp)};
}

/* ---------------- the screen ---------------- */

function ncCapRow(name, v, labels){
  const ok = v.ok;
  return `<tr class="${ok?'':'xw-row-changed'}">
    <td class="mono tiny strong">${ncEsc(name)}</td>
    <td>${ok?'<span class="pill p-ok"><span class="dot"></span>produced</span>'
            :'<span class="pill p-er"><span class="dot"></span>not produced</span>'}</td>
    <td class="tiny muted">${ncEsc(v.why || v.note || '')}</td>
    <td class="tiny muted">${labels?Object.entries(labels).map(([k,l])=>
      `<span class="tag mono">${k}</span> ${ncEsc(l)}`).join('<br>'):''}</td></tr>`;
}


/* ---------------- capability, on the Overview tab ---------------- */
function ncCapabilityCard(b){
  const edu = b.kind==='education';
  const d = edu ? ncDeriveEdu(b) : ncDeriveWash(b);
  const cap = d.capability;
  const order = edu ? ['educat7','educat5','educat4','educy']
                    : Object.keys(cap).filter(k=>k!=='finest');
  const blocked = order.filter(k=>!cap[k].ok);
  const where = edu ? 'the Ladder and Programmes tabs'
                    : 'the Classification tree and Categories tabs';
  return ncCard('GMD canonical variables',
    'what this concordance can produce, and where it cannot, why not',
   `<div class="tiny muted" style="line-height:1.85;max-width:1000px">
      The concordance maps <b>atomic</b> things — ${ncEsc((d.atomic||[]).join(', '))}. Everything GMD publishes is a
      deterministic function of that and is computed in code, never mapped by an agent. The values themselves sit in
      ${where}; this card is only about which of them exist for ${ncEsc(b.country.name)}.
    </div>
    ${blocked.length?`<div class="ncwarn mt"><b>${blocked.length} of ${order.length} cannot be produced.</b>
      ${blocked.map(k=>`<span class="mono">${k}</span>`).join(', ')} — see the reason below.</div>`:''}
    <div class="tbl-wrap mt"><table class="tbl">
      <thead><tr><th style="width:15%">Variable</th><th style="width:12%">State</th>
        <th style="width:38%">Note</th><th>Value labels</th></tr></thead>
      <tbody>${order.map(k=>ncCapRow(k, cap[k], (d.labels||{})[k])).join('')}</tbody>
    </table></div>
    ${edu?'':`<div class="lvlnote mt"><b>Improved is a range, not a judgement.</b>
      <span class="mono">${b.domain==='water'?'water_source':'sanitation_source'}</span> 1–8 is improved, 9–13 is not,
      and 14 is the country's own call and is left missing. The GMD code list is ordered that way on purpose, so the
      derivation maps a category to its code and lets the range decide.</div>`}`,
   `<span class="tiny muted">finest</span>
    <span class="mono strong" style="color:${cap.finest?'var(--ok)':'var(--er)'}">${ncEsc(cap.finest||'none')}</span>
    ${d.computed_here?`<span class="pill p-ai" title="this bundle predates the derivation artefact; the same rules were applied in the browser"><span class="dot"></span>computed here</span>`:''}`);
}

function ncDeriveCard(b){
  const edu = b.kind==='education';
  const d = edu ? ncDeriveEdu(b) : ncDeriveWash(b);
  const cap = d.capability;
  const order = edu ? ['educat7','educat5','educat4','educy']
                    : Object.keys(cap).filter(k=>k!=='finest');
  const finest = cap.finest;
  const blocked = order.filter(k=>!cap[k].ok);

  const head = `<div class="card"><div class="card-b">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <h3 style="font-size:14px;margin:0">GMD canonical variables</h3>
      <span class="tag">${ncEsc(d.frame)}</span>
      ${d.computed_here?`<span class="pill p-ai" title="this bundle predates the derivation artefact; the same rules were applied here"><span class="dot"></span>computed in the browser</span>`:''}
      <span class="sp"></span>
      <span class="tiny muted">finest variable this concordance supports</span>
      <span class="mono strong" style="color:${finest?'var(--ok)':'var(--er)'}">${ncEsc(finest||'none')}</span>
    </div>
    <div class="tiny muted mt-s" style="line-height:1.85;max-width:960px">
      The concordance maps <b>atomic</b> things — ${ncEsc((d.atomic||[]).join(', '))}. Everything GMD publishes is a
      deterministic function of that and is computed in code, never mapped by an agent. Not every country's source
      supports every variable; where it does not, the variable is left missing and the reason is stated rather than
      a plausible value produced.
    </div>
    ${blocked.length?`<div class="ncwarn mt"><b>${blocked.length} of ${order.length} cannot be produced for
      ${ncEsc(b.country.name)}.</b> ${blocked.map(k=>`<span class="mono">${k}</span>`).join(', ')} —
      see the reason in the table below.</div>`:''}
  </div></div>`;

  const capTable = ncCardFlush('What this country can produce',
    'and where it cannot, why not',
    `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th style="width:15%">Variable</th><th style="width:12%">State</th>
        <th style="width:38%">Note</th><th>Value labels</th></tr></thead>
      <tbody>${order.map(k=>ncCapRow(k, cap[k], (d.labels||{})[k])).join('')}</tbody>
    </table></div>`);

  if(edu){
    const xw = d.crosswalk||[];
    const carried = xw.filter(r=>r.carried_forward).length;
    return head + capTable + ncCardFlush('Grade → canonical value',
      'the last grade completed decides all four',
      `<div class="tbl-wrap" style="max-height:560px"><table class="tbl tbl-frz">
        <thead><tr><th style="width:6%">Grade</th><th style="width:6%">ISCED</th>
          <th style="width:22%">Programme</th><th style="width:7%">Ends level</th>
          <th style="width:6%">educat7</th><th style="width:6%">educat5</th>
          <th style="width:6%">educat4</th><th style="width:6%">educy</th>
          <th>What educat7 means here</th></tr></thead>
        <tbody>${xw.map(r=>`<tr class="${r.carried_forward?'xw-row-changed':''}">
          <td class="mono tiny strong">${r.grade}</td>
          <td class="mono tiny">${ncEsc(r.isced)}</td>
          <td class="tiny">${ncEsc(r.programme)}</td>
          <td class="tiny">${r.completes_level?'<span class="pill p-ok"><span class="dot"></span>yes</span>':'<span class="dim">—</span>'}</td>
          <td class="mono tiny strong" style="color:var(--ac)">${r.educat7==null?'<span class="dim">—</span>':r.educat7}</td>
          <td class="mono tiny">${r.educat5==null?'<span class="dim">—</span>':r.educat5}</td>
          <td class="mono tiny">${r.educat4==null?'<span class="dim">—</span>':r.educat4}</td>
          <td class="mono tiny">${r.educy==null?'<span class="dim">—</span>':r.educy}</td>
          <td class="tiny muted">${ncEsc(r.educat7_label)}${r.carried_forward
            ? ` <span class="tag" style="border-color:var(--wa);color:var(--wa)">carried from grade below</span>`:''}</td>
        </tr>`).join('')}</tbody></table></div>
      <div class="tiny muted" style="padding:8px 12px;line-height:1.8">
        <b>educy is years, not levels.</b> The ladder carries the level's total on every rung of it, so years at
        grade 3 of a six-year primary cycle are 3, not 6.
        ${carried?`<br><b>${carried} row${carried===1?'':'s'} carried forward.</b> Where a workbook documents two
        tracks over the same grades, the ladder takes one as the main path and the other can make a later grade
        look like a lower attainment. More schooling cannot mean less education, so the higher value is carried
        and the carry is shown rather than hidden.`:''}
      </div>`)
      + ncDeriveCode(b, d);
  }

  const xw = d.crosswalk||[];
  const dis = d.disagreements||xw.filter(r=>r.disagrees_with_jmp);
  const src = b.domain==='water'?'water_source':'sanitation_source';
  return head + capTable
    + ncCard('The improved rule',
      'a range on the GMD code list, not a judgement per category',
      `<div class="split s-2">
        <div>${ncKv([
          ['Improved', `<span class="mono">${src} 1–8</span> → 1`, true],
          ['Not improved', `<span class="mono">${src} 9–13</span> → 0`, true],
          ['Country call', `<span class="mono">${src} = 14</span> → left missing`, true],
        ])}
        <div class="tiny muted mt-s" style="line-height:1.85">The GMD code list is <i>ordered</i> so that improved
        sources occupy 1–8. That is why the derivation maps a category to its GMD code and lets the range decide,
        instead of asking JMP whether it is improved.</div></div>
        <div>${dis.length?`<div class="ncwarn"><b>${dis.length} categor${dis.length===1?'y':'ies'} disagree with
          JMP.</b><div class="tiny mt-s" style="line-height:1.8">${ncEsc(dis[0].disagreement_note||'')}</div></div>`
          :`<div class="evc"><div class="tiny muted">Every category agrees with the JMP node it sits on.</div></div>`}</div>
      </div>`)
    + ncCardFlush('National category → GMD code',
      `${xw.length} categories`,
      `<div class="tbl-wrap" style="max-height:560px"><table class="tbl tbl-frz">
        <thead><tr><th style="width:24%">National label</th><th style="width:22%">JMP node</th>
          <th style="width:7%">Code</th><th style="width:20%">GMD label</th>
          <th style="width:9%">Improved</th><th style="width:9%">Access</th><th>Note</th></tr></thead>
        <tbody>${xw.map(r=>`<tr class="${r.spans.length?'xw-row-changed':r.disagrees_with_jmp?'xw-row-new':''}">
          <td class="tiny strong">${ncEsc(r.label)}</td>
          <td class="tiny mono muted">${ncEsc(r.jmp_id||'')}</td>
          <td class="mono tiny strong" style="color:var(--ac)">${r.gmd_code==null?'<span class="dim">—</span>':r.gmd_code}</td>
          <td class="tiny">${ncEsc(r.gmd_label)}</td>
          <td class="tiny">${r.improved===1?'<span class="pill p-ok"><span class="dot"></span>yes</span>'
            :r.improved===0?'<span class="pill p-er"><span class="dot"></span>no</span>'
            :'<span class="pill p-wa"><span class="dot"></span>country call</span>'}</td>
          <td class="tiny mono">${r.access==null?'<span class="dim">—</span>':r.access}</td>
          <td class="tiny muted">${r.spans.length
            ? `spans ${r.spans.map(x=>`<span class="tag mono">${x}</span>`).join(' ')} — needs a splitting rule`
            : r.disagrees_with_jmp ? 'differs from JMP' : ''}</td>
        </tr>`).join('')}</tbody></table></div>`)
    + ncDeriveCode(b, d);
}

/* the generated code, when the bundle carries it */
function ncDeriveCode(b, d){
  const code = d.stata;
  if(!code) return `<div class="card mt"><div class="card-b">
    <div class="lvlnote"><b>The generated do-file is not in this bundle.</b>
      It is written by the extractor as
      <span class="mono">${ncEsc(b.country.iso3)}_${ncEsc(b.kind==='education'?'edu':b.domain)}_derive.do</span>
      alongside the other artefacts. This folder was extracted before that artefact existed; re-running the
      extractor produces it, and the table above is what it will contain.</div>
  </div></div>`;
  const lines = code.split('\n');
  return `<div class="card mt"><div class="card-h"><h3>The derivation, as code</h3>
      <span class="sub">${ncEsc(b.country.iso3)}_${ncEsc(b.kind==='education'?'edu':b.domain)}_derive.do · ${lines.length} lines</span></div>
    <div class="card-b"><div class="codelist">${lines.map((l,i)=>
      `<div class="cl${l.trim().startsWith('*')?' com':''}${/NOT PRODUCED/.test(l)?' warn':''}">
        <i>${i+1}</i><span>${ncEsc(l)||'&nbsp;'}</span></div>`).join('')}</div></div></div>`;
}

</script>
<script>
/* =====================================================================
   National concordance — the page.
   The landing view is real: it is built from concordance_registry.json
   as it stood when this file was generated. Country detail is read live
   from the folder you attach, so nothing here is a mock of your data.
   ===================================================================== */

var NC_STATE = {
  screen:'list', iso:null, domain:'education', tab:'overview',
  q:'', region:'', status:'', sort:'country', dir:1, pg:0, size:25,
  du:null, theme:'dark',
};
var NC_CUR = null;      /* the bundle currently open */
var NC_SRC = null;      /* {label, read(path), has(path), list()} */
var NC_CACHE = {};

function $q(s,r){ return (r||document).querySelector(s); }

/* ---------------- registry index ---------------- */
const NC_DOMS = [
  {k:'education', c:'e', label:'Education', sys:'S8',  frame:'ISCED 2011'},
  {k:'water',     c:'w', label:'Water',     sys:'S9',  frame:'JMP ladders'},
  {k:'sanitation',c:'s', label:'Sanitation',sys:'S9',  frame:'JMP ladders'},
  {k:'isic',      c:null,label:'Industry',  sys:'S8b', frame:'ISIC Rev.4'},
  {k:'isco',      c:null,label:'Occupation',sys:'S9b', frame:'ISCO-08'},
];
const NC_VMAP = {c:'clean', a:'awaiting_review', b:'blocked'};

function ncRows(){ return NC_INDEX.rows; }
function ncRow(iso){ return ncRows().filter(r=>r.i===iso)[0]; }
function ncDom(r, k){ const d=NC_DOMS.filter(x=>x.k===k)[0]; return d && d.c ? r[d.c] : null; }

function ncCoverage(k){
  const d=NC_DOMS.filter(x=>x.k===k)[0], out={clean:0,awaiting_review:0,blocked:0,none:0};
  ncRows().forEach(r=>{
    const x = d.c ? r[d.c] : null;
    if(!x) out.none++; else out[NC_VMAP[x.d]||'blocked']++;
  });
  return out;
}

/* ---------------- landing ---------------- */
function ncFiltered(){
  const q=NC_STATE.q.toLowerCase();
  let rs = ncRows().filter(r=>{
    if(q && r.n.toLowerCase().indexOf(q)<0 && r.i.toLowerCase().indexOf(q)<0) return false;
    if(NC_STATE.region && r.r!==NC_STATE.region) return false;
    if(NC_STATE.status){
      const ds=['e','w','s'].map(c=>r[c]).filter(Boolean);
      if(NC_STATE.status==='none'){ if(ds.length===3) return false; }
      else if(!ds.some(x=>NC_VMAP[x.d]===NC_STATE.status)) return false;
    }
    return true;
  });
  const key = NC_STATE.sort, dir = NC_STATE.dir;
  const val = r => key==='country' ? r.n : key==='region' ? r.r
    : key==='complete' ? ['e','w','s'].filter(c=>r[c]).length
    : key==='findings' ? ['e','w','s'].reduce((a,c)=>a+(r[c]?r[c].B*100+r[c].W:0),0)
    : (r[key]? (r[key].d==='c'?0:r[key].d==='a'?1:2) : 3);
  rs.sort((a,b)=>{
    if((a.i==='UNK')!==(b.i==='UNK')) return a.i==='UNK'?1:-1;
    const x=val(a), y=val(b); return (x<y?-1:x>y?1:0)*dir || (a.n<b.n?-1:1); });
  return rs;
}

/* ---------------- folder sources ---------------- */
function ncSetSrc(src){
  NC_SRC = src; NC_CACHE = {};
  ncToast(`${src.label} — ${src.count} files`);
  ncRender();
}
/* the modern picker needs a secure origin; opened from disk it throws, so fall
   back to the directory input, which works everywhere and uploads nothing */
function ncAttach(){
  if(window.showDirectoryPicker && location.protocol!=='file:'){
    window.showDirectoryPicker().then(h=>ncWalkHandle(h)).catch(e=>{
      if(e && e.name==='AbortError') return;
      ncFileInput();
    });
    return;
  }
  ncFileInput();
}
function ncFileInput(){ const i=$q('#ncFiles'); if(i){ i.value=''; i.click(); } }
var ncPickDir = ncAttach;
async function ncWalkHandle(handle){
  const map = {};
  async function walk(dir, prefix){
    for await (const [name, h] of dir.entries()){
      if(h.kind==='directory') await walk(h, prefix+name+'/');
      else map[prefix+name] = h;
    }
  }
  await walk(handle, '');
  ncSetSrc({label:'Folder attached', count:Object.keys(map).length,
    has:p=>ncFind(map,p)!=null,
    read:p=>{ const k=ncFind(map,p); if(!k) return Promise.reject(new Error(p+' not found'));
      return map[k].getFile().then(f=>f.text()); }});
}
function ncTakeFiles(fl){
  const map={};
  [...fl].forEach(f=>{ map[(f.webkitRelativePath||f.name)] = f; });
  ncSetSrc({label:'Folder attached', count:Object.keys(map).length,
    has:p=>ncFind(map,p)!=null,
    read:p=>{ const k=ncFind(map,p); if(!k) return Promise.reject(new Error(p+' not found'));
      return map[k].text ? map[k].text() : new Promise((res,rej)=>{
        const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsText(map[k]); }); }});
}
/* paths in the index are ISO/FILE — the picked root may sit above or at that level */
function ncFind(map, p){
  if(map[p]) return p;
  const tail = p.toLowerCase();
  const keys = Object.keys(map);
  for(let i=0;i<keys.length;i++){
    const k=keys[i].toLowerCase();
    if(k===tail || k.endsWith('/'+tail)) return keys[i];
  }
  const base = tail.split('/').pop();
  for(let i=0;i<keys.length;i++){
    if(keys[i].toLowerCase().endsWith('/'+base)) return keys[i];
  }
  return null;
}
function ncDrop(e){
  e.preventDefault();
  const items=[...(e.dataTransfer.items||[])];
  const dirH = items.map(i=>i.getAsFileSystemHandle?i.getAsFileSystemHandle():null).filter(Boolean);
  if(dirH.length){
    Promise.all(dirH).then(hs=>{ const d=hs.filter(h=>h.kind==='directory')[0];
      if(d) ncWalkHandle(d); else ncToast('Drop the folder, not a single file.', true); });
    return;
  }
  const ent = items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const map={};
  const readEntry = (en, prefix)=> new Promise(res=>{
    if(en.isFile) en.file(f=>{ map[prefix+en.name]=f; res(); });
    else { const rd=en.createReader(); const all=[];
      const step=()=>rd.readEntries(es=>{ if(!es.length){ Promise.all(all.map(x=>readEntry(x,prefix+en.name+'/'))).then(res); return; }
        all.push(...es); step(); });
      step(); }
  });
  Promise.all(ent.map(en=>readEntry(en,''))).then(()=>{
    if(!Object.keys(map).length){ ncToast('Nothing readable in that drop.', true); return; }
    ncSetSrc({label:'Folder attached', count:Object.keys(map).length,
      has:p=>ncFind(map,p)!=null,
      read:p=>{ const k=ncFind(map,p); if(!k) return Promise.reject(new Error(p+' not found'));
        return new Promise((res,rej)=>{ const fr=new FileReader();
          fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsText(map[k]); }); }});
  });
}
/* if this file is served from inside the folder, just fetch */
function ncTryFetch(){
  if(location.protocol==='file:') return Promise.resolve(false);
  return fetch('ALB/ALB_edu_view.json',{cache:'no-store'}).then(r=>{
    if(!r.ok) throw 0;
    NC_SRC = {label:'Served from the folder', count:0, has:()=>true,
      read:p=>fetch(p,{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(p+' — '+r.status); return r.text(); })};
    return true;
  }).catch(()=>false);
}

function ncOpen(iso, dom){
  NC_STATE.iso=iso; NC_STATE.screen='detail'; NC_STATE.tab='overview'; NC_STATE.du=null;
  const r=ncRow(iso);
  NC_STATE.domain = dom || (r.e?'education':r.w?'water':r.s?'sanitation':'isic');
  NC_CUR=null; ncRender(); ncLoad();
}

function ncPath(iso, dom, suffix){ return `${iso}/${iso}_${dom==='education'?'edu':dom}_${suffix}`; }

function ncLoad(){
  const iso=NC_STATE.iso, dom=NC_STATE.domain;
  if(dom==='isic'||dom==='isco'){ NC_CUR=null; ncRender(); return; }
  const key=iso+'/'+dom;
  if(NC_CACHE[key]){ NC_CUR=NC_CACHE[key]; ncRender(); return; }
  if(!NC_SRC){ ncRender(); return; }
  const p = ncPath(iso,dom,'view.json');
  NC_SRC.read(p).then(t=>{
    const b=JSON.parse(t); NC_CACHE[key]=b; NC_CUR=b; ncRender();
  }).catch(e=>{ NC_CUR={__err:e.message, __path:p}; ncRender(); });
}

function ncExport(){
  const head=['iso3','country','region','domain','version','verdict','status','rows','block','warn','info','file'];
  const lines=[head.join(',')];
  ncRows().forEach(r=>{
    NC_DOMS.forEach(d=>{
      const x=d.c?r[d.c]:null;
      lines.push([r.i,`"${r.n.replace(/"/g,'""')}"`,r.r,d.k,
        x?x.v:'', x?NC_VMAP[x.d]:'not_started', x?x.st:'', x&&x.n!=null?x.n:'',
        x?x.B:'', x?x.W:'', x?x.I:'', x?`"${(x.file||'').replace(/"/g,'""')}"`:''].join(','));
    });
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='national_concordance_coverage.csv'; a.click();

/* ---------------- render ---------------- */
function ncRender(){
  const html = NC_STATE.screen==='list' ? ncListScreen() : ncDetailScreen();
  $q('#ncPage').innerHTML = html;
  $q('#ncSrcBar').innerHTML = NC_SRC
    ? `<span class="pill p-ok"><span class="dot"></span>${ncEsc(NC_SRC.label)}</span>
       <button class="btn xs" onclick="ncAttach()">Change…</button>`
    : `<span class="pill p-wa"><span class="dot"></span>no folder attached</span>
       <button class="btn xs" onclick="ncAttach()">Attach…</button>`;
  const d=$q('#ncDrop');
  if(d){
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{d.classList.remove('over');ncDrop(e);});
  }
  if(NC_STATE.screen==='detail' && NC_STATE.tab==='resolver' && NC_CUR) ncDrawResolve();
  ncA11y();
}
function ncA11y(){
  document.querySelectorAll('#ncPage [onclick]').forEach(el=>{
    if(el.matches('button, a[href], select, input, textarea, label, [tabindex]')) return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  });
  document.querySelectorAll('#ncPage th[onclick]').forEach(th=>{
    const t=th.textContent;
    th.setAttribute('aria-sort', /▲/.test(t)?'ascending':/▼/.test(t)?'descending':'none');
  });
  document.querySelectorAll('#ncPage svg:not([aria-label])').forEach(s=>s.setAttribute('aria-hidden','true'));
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ ncCloseModal(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.getAttribute && e.target.getAttribute('role')==='button'
     && !e.target.matches('input,textarea,select,button,a[href]')){ e.preventDefault(); e.target.click(); }
});

function ncBoot(){
  let t='dark';
  try{ t=localStorage.getItem('nc_theme')||'dark'; }catch(e){}
  NC_STATE.theme=t; document.documentElement.dataset.theme=t;
  ncTryFetch().then(ok=>{ ncRender(); });
}
document.addEventListener('DOMContentLoaded', ncBoot);

</script>
</body>
</html>
